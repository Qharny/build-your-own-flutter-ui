name: Scheduled Link Check

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 100..=103,200..=299,403,429
            README.md curated-list/README.md
          format: markdown
          output: ./lychee-report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: File or update report issue
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("lychee-report.md", "utf8");
            const title = "Automated Link Check Report";
            const label = "broken-link";
            const today = new Date().toISOString().slice(0, 10);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const existing = issues.find((i) => i.title === title);

            const contributingUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md#-link-rot--dead-links`;
            const body = [
              `_Automated weekly link check — ${today}_`,
              "",
              report,
              "",
              `Please fix or remove the affected entries (see [CONTRIBUTING.md](${contributingUrl})). This issue is reused and updated by the next scheduled run.`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Link check re-ran on ${today} and still found broken links. Report updated above.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "automated"],
              });
            }

      - name: Close stale report issue if all links are healthy
        if: steps.lychee.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated Link Check Report";
            const label = "broken-link";

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "All links are now passing the automated check. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
